name: Codex selective archive copy
on:
  push:
    branches:
      - codex/selective-archive-finalist-media
permissions:
  contents: write
jobs:
  patch-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/selective-archive-finalist-media
      - name: Update archive copy and regression assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old = "Il Contest verrà rimosso dalla visuale pubblica e tutti i video e le relative anteprime verranno eliminati definitivamente dall’app. Risultati, finalisti e dati storici resteranno conservati."
          new = "Il Contest verrà archiviato. I video e le anteprime dei non finalisti verranno eliminati definitivamente; i media dei finalisti ufficiali saranno conservati insieme a risultati e dati storici."
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one old Admin archive copy, found {text.count(old)}')
          index.write_text(text.replace(old, new), encoding='utf-8', newline='')

          test = Path('tests/contest-archive-media-cleanup.test.mjs')
          test_text = test.read_text(encoding='utf-8')
          old_assert = r"assert.match(index, /Il Contest verrà rimosso dalla visuale pubblica e tutti i video e le relative anteprime verranno eliminati definitivamente dall’app\. Risultati, finalisti e dati storici resteranno conservati\./);"
          new_assert = r"assert.match(index, /Il Contest verrà archiviato\. I video e le anteprime dei non finalisti verranno eliminati definitivamente; i media dei finalisti ufficiali saranno conservati insieme a risultati e dati storici\./);"
          if test_text.count(old_assert) != 1:
              raise SystemExit(f'Expected exactly one old regression assertion, found {test_text.count(old_assert)}')
          test.write_text(test_text.replace(old_assert, new_assert), encoding='utf-8', newline='')
          PY
      - name: Run focused archive tests
        run: node --test tests/contest-archive-media-cleanup.test.mjs tests/selective-contest-archive-media.test.mjs
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/codex-selective-archive-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/contest-archive-media-cleanup.test.mjs .github/workflows/codex-selective-archive-copy.yml
          git commit -m "Align Admin archive copy with finalist retention"
          git push origin HEAD:codex/selective-archive-finalist-media
