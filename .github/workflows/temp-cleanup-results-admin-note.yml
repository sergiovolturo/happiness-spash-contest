name: Temporary results cleanup

on:
  push:
    branches:
      - codex/cleanup-results-admin-note

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/cleanup-results-admin-note
          fetch-depth: 0
      - name: Apply focused patch
        run: python3 scripts/temp_cleanup_results.py
      - name: Run focused regression tests
        run: node --test tests/admin-results-cleanup.test.mjs
      - name: Commit focused patch
        run: |
          git rm .github/workflows/temp-cleanup-results-admin-note.yml scripts/temp_cleanup_results.py
          git add index.html tests/admin-results-cleanup.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix Admin results cleanup"
          git push origin HEAD:codex/cleanup-results-admin-note
