async function render(){
  const requestId=++renderRequestSeq;
  activeRenderAbortController?.abort();
  activeRenderAbortController=new AbortController();
  activeRenderRequestId=requestId;
  if(isAdmin&&currentTab==='upload')currentTab='admin';
  const requestedTab=currentTab;
  renderTrace('start',requestId,requestedTab);
  syncAuthButtons();
  app.innerHTML=nav()+'<div id="view"><div class="spinner"></div></div>';
  try{
    if(requestedTab==='home')await renderStep(homeView(requestId),'home',requestId,requestedTab);
    if(requestedTab==='upload'){
      if(typeof ensureSubmissionContest==='function')await renderStep(ensureSubmissionContest(requestId),'submission-contest',requestId,requestedTab);
      if(session)await renderStep(loadParticipantContext(),'participant',requestId,requestedTab);
      if(renderIsCurrent(requestId))await renderStep(submissionView(requestId),'submission',requestId,requestedTab);
    }
    if(requestedTab==='vote'&&renderIsCurrent(requestId))await renderStep(voteView(requestId),'vote',requestId,requestedTab);
    if(requestedTab==='admin'&&renderIsCurrent(requestId))await renderStep(renderAdmin(requestId),'admin',requestId,requestedTab);
    if(renderIsCurrent(requestId)){adminHumanizeStatusLabels(document.querySelector('#view'));renderTrace('complete',requestId,requestedTab)}else renderTrace('stale',requestId,requestedTab);

  }
}
