<style>

*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(150deg,#e9f9fb 0%,#fff 42%,#f2fafb 100%);color:var(--ink);min-height:100vh}
button,input,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1120px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 0 24px}
.brand{display:flex;align-items:center;gap:12px}.mark{width:46px;height:46px;border-radius:16px;background:var(--brand);display:grid;place-items:center;color:#fff;font-weight:900;font-size:21px;box-shadow:0 10px 25px #0097b233}.brand h1{font-size:18px;margin:0;line-height:1.1}.brand small{color:var(--muted)}
.card{background:#ffffffdd;border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 50px #075f7012;padding:24px}.auth{max-width:480px;margin:5vh auto}.auth h2{font-size:32px;margin:0 0 8px}.auth p{color:var(--muted);margin:0 0 24px}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 7px}.input{width:100%;border:1px solid #bfd5da;border-radius:14px;background:#fff;padding:13px 14px;outline:none}.input:focus{border-color:var(--brand);box-shadow:0 0 0 4px #0097b21c}
.btn{border:0;border-radius:14px;padding:12px 17px;font-weight:800;background:#e8f5f7;color:var(--ink)}.btn.primary{background:var(--brand);color:#fff;box-shadow:0 8px 20px #0097b232}.btn.danger{background:#fff0f1;color:var(--danger)}.btn:disabled{opacity:.48;cursor:not-allowed}.wide{width:100%;margin-top:18px}.link{border:0;background:none;color:var(--brand);font-weight:800;padding:8px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.nav .btn.active{background:var(--ink);color:#fff}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.hero{background:var(--ink);color:#fff;border-radius:28px;padding:28px;margin-bottom:18px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-70px;top:-80px;background:radial-gradient(circle,#08c8e888,transparent 68%)}.hero h2{font-size:clamp(28px,5vw,54px);max-width:680px;line-height:1;margin:0 0 12px}.hero p{color:#c4e2e7;max-width:620px;margin:0}.eyebrow{letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:#76d9e8;font-weight:900;margin-bottom:12px}
.stat{padding:18px}.stat b{display:block;font-size:30px}.stat span{color:var(--muted);font-size:14px}.section-title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:26px 0 12px}.section-title h2{margin:0}.muted{color:var(--muted)}.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.video-card{padding:0;overflow:hidden}.video-card video{width:100%;aspect-ratio:9/16;max-height:460px;background:#071b22;display:block}.video-body{padding:17px}.video-body h3{margin:0 0 3px}.badge{display:inline-flex;border-radius:99px;padding:5px 9px;font-size:12px;font-weight:800;background:#edf5f6;color:#4c6369}.badge.pending{background:#fff5d9;color:#8a6200}.badge.approved{background:#e7f8f1;color:var(--ok)}.badge.rejected{background:#ffedef;color:var(--danger)}
.upload-zone{border:2px dashed #a8ccd3;border-radius:18px;padding:28px;text-align:center;background:#f6fcfd}.checks label{display:flex;gap:10px;align-items:flex-start;font-weight:500}.checks input{margin-top:3px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.notice{border-radius:14px;padding:12px 14px;background:#eaf8fa;color:#075c6c;margin:12px 0}.error{background:#ffeff1;color:#982d3a}.success{background:#eaf8f1;color:#126942}.hidden{display:none!important}.spinner{width:22px;height:22px;border:3px solid #bce5eb;border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}.rank{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}
@media(max-width:760px){.shell{padding:14px}.grid,.grid.two{grid-template-columns:1fr}.card{border-radius:19px;padding:18px}.hero{padding:23px}.top{align-items:flex-start}.top .btn{padding:9px 11px}.video-card video{max-height:520px}}
.adminCategories{display:grid;gap:12px}.adminCategoryRow{display:grid;grid-template-columns:minmax(140px,2fr) minmax(120px,1fr) repeat(2,minmax(100px,.7fr)) auto;gap:10px;align-items:end;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff}.adminCategoryActions{display:flex;gap:6px;flex-wrap:wrap}.adminCategoryActions .btn{padding:9px 11px}.adminModerationGroup{margin:20px 0}.adminModerationGroup>header{position:sticky;top:0;z-index:2;background:#f3fafbf2;border:1px solid var(--line);border-radius:16px;padding:14px 18px;backdrop-filter:blur(8px)}.adminSubmissionGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:12px}.adminSubmission{display:grid;grid-template-columns:minmax(180px,.85fr) minmax(220px,1.15fr);gap:12px;align-items:start}.adminSubmission video{width:100%;max-width:640px;aspect-ratio:16/9;object-fit:contain;background:#071b22;border-radius:14px}.adminSubmission .adminSubmissionInfo{min-width:0}.adminManualForm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.adminManualForm .wideField{grid-column:1/-1}.categoryManagerList{display:grid;gap:10px}.publicCategoryGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.publicCategoryCard{min-height:190px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;touch-action:manipulation}.categoryVisualSlot{display:block;width:100%;min-height:76px;border-radius:14px;background:linear-gradient(135deg,#d8f3f6,#f2fbfc);margin-bottom:12px}.publicVideoGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.publicVideoCard{min-height:180px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left}.publicVideoPoster{width:100%;aspect-ratio:16/9;border-radius:14px;background:linear-gradient(135deg,#071b22,#167c8b);color:#fff;display:grid;place-items:center;font-size:28px}.publicVideoDetail video{width:min(100%,800px);max-height:70vh;aspect-ratio:16/9;background:#071b22;display:block;border-radius:18px}.categoryBack{margin:8px 0 16px}@media(max-width:760px){.adminCategoryRow{grid-template-columns:1fr 1fr}.adminSubmissionGrid,.publicCategoryGrid,.publicVideoGrid{grid-template-columns:1fr}.adminSubmission{grid-template-columns:1fr}.adminManualForm{grid-template-columns:1fr}.adminManualForm .wideField{grid-column:auto}.adminModerationGroup>header{position:static}.publicCategoryCard{min-height:160px}.publicVideoCard{min-height:160px}}
</style>

<body>
<div class="shell">
<header class="top"><div class="brand"><div class="mark">H</div><div><h1>HAPPINESS × SPASH</h1><small>Highlight Contest</small></div></div><div class="actions"><button id="login" class="btn">Accedi</button><button id="logout" class="btn hidden">Esci</button></div></header>
<main id="app"><div class="spinner"></div></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js" onerror="document.getElementById('app').innerHTML='<div class=&quot;notice error&quot;>Impossibile caricare l’app. Aggiorna la pagina oppure prova senza blocco pubblicità.</div>'"></script>
<script>
const supabase=window.supabase.createClient('https://pkaadvqyrdxgymzzugvo.supabase.co','sb_publishable_Yru2Ftclbaq6n-7laSrP_A_su230R5h');
const app=document.querySelector('#app'), login=document.querySelector('#login'), logout=document.querySelector('#logout');
let session=null,isAdmin=false,settings=null,currentTab='home';
let publicContest=null,publicCategories=[],participantId=null,submissionRows=[],mediaRows=[],galleryRows=[],galleryError=null,gallerySelectedCategoryId=null,galleryLoadedContestId=null,galleryRequestSeq=0;
const galleryObjectUrls=new Map(),galleryMediaErrors=new Map();
let galleryActiveMediaId=null,adminCategoryRows=[],adminIdentityRows=[],adminManualPending=null;
let publicContestError=null,publicCategoryError=null,participantError=null,submissionError=null,mediaError=null;
let votedCategoryIds=new Set(),voteStateError=null,voteTarget=null,otpEmail='',otpPending=false,otpVerified=false,adminResultsRequestSeq=0;
let authReady=false,authRequestSeq=0;
const uploadedMediaIds=new Set();
const mediaUploadInFlight=new Set();
const adminActionsInFlight=new Set();
let adminContestRows=[],adminSelectedContestId=null;
const otpRequestInFlight={value:false},otpVerifyInFlight={value:false},voteInFlight=new Set();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const msg=(text,type='notice')=>'<div class="notice '+type+'">'+esc(text)+'</div>';
const fmt=n=>new Intl.DateTimeFormat('it-IT',{dateStyle:'medium',timeStyle:'short'}).format(new Date(n));
function syncAuthButtons(){const authenticated=!!session;login.classList.toggle('hidden',authenticated);logout.classList.toggle('hidden',!authenticated)}
async function boot(){try{await loadPublicContest();const {data,error}=await supabase.auth.getSession();if(error)throw error;session=data.session;authReady=true;syncAuthButtons();if(!session)return render();await loadContext();await loadVoteState();render()}catch(error){authReady=true;syncAuthButtons();app.innerHTML=msg('Errore di collegamento. Aggiorna la pagina e riprova.','error');console.error(error)}}
supabase.auth.onAuthStateChange(async(_,s)=>{const requestId=++authRequestSeq;session=s;syncAuthButtons();if(!authReady)return;if(s){await loadContext();await loadVoteState();if(requestId!==authRequestSeq||session!==s)return;render()}else{isAdmin=false;settings=null;participantId=null;submissionRows=[];mediaRows=[];votedCategoryIds=new Set();voteStateError=null;otpPending=false;otpVerified=false;adminResultsRequestSeq++;galleryRequestSeq++;clearGalleryObjectUrls();galleryRows=[];galleryLoadedContestId=null;render()}});
login.onclick=()=>authView();
logout.onclick=async()=>supabase.auth.signOut();
function authView(){syncAuthButtons();login.classList.add('hidden');logout.classList.add('hidden');app.innerHTML=`
<section class="card auth"><div class="eyebrow">Happiness SPASH Contest</div><h2 id="authTitle">Entra nel contest.</h2><p id="authSub">Accedi per caricare i tuoi highlight e votare.</p><div id="authMsg"></div>
<form id="loginForm"><div id="registerFields" class="hidden"><label>Nome e cognome</label><input class="input" id="fullName" autocomplete="name"><label>Profilo Instagram</label><input class="input" id="instagram" placeholder="@username"></div>
<label>Email</label><input class="input" id="email" type="email" required autocomplete="email"><label>Password</label><input class="input" id="password" type="password" required minlength="8" autocomplete="current-password">
<button class="btn primary wide" id="authSubmit">Accedi</button></form><button class="link wide" id="toggleAuth">Non hai un account? Registrati</button><button class="link wide" id="backToContest">← Torna al Contest</button></section>`;
document.querySelector('#backToContest').onclick=()=>{currentTab='home';render()};
let register=false;document.querySelector('#toggleAuth').onclick=()=>{register=!register;document.querySelector('#registerFields').classList.toggle('hidden',!register);document.querySelector('#authTitle').textContent=register?'Crea il tuo account.':'Entra nel contest.';document.querySelector('#authSubmit').textContent=register?'Registrati':'Accedi';document.querySelector('#toggleAuth').textContent=register?'Hai già un account? Accedi':'Non hai un account? Registrati';document.querySelector('#password').autocomplete=register?'new-password':'current-password'};
document.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();const box=document.querySelector('#authMsg'),btn=document.querySelector('#authSubmit');btn.disabled=true;box.innerHTML='';const email=document.querySelector('#email').value.trim(),password=document.querySelector('#password').value;let error;
if(register){const full_name=document.querySelector('#fullName').value.trim();if(full_name.length<2){box.innerHTML=msg('Inserisci nome e cognome.','error');btn.disabled=false;return}({error}=await supabase.auth.signUp({email,password,options:{emailRedirectTo:'https://gabrieledellatti22.github.io/happiness-spash-contest/',data:{full_name,instagram_handle:document.querySelector('#instagram').value.trim()}}}));if(!error)box.innerHTML=msg('Registrazione completata. Controlla la tua email per confermare l’account.','success')}
else({error}=await supabase.auth.signInWithPassword({email,password}));
if(error)box.innerHTML=msg(error.message,'error');btn.disabled=false};
}
async function loadContext(){logout.classList.remove('hidden');const [{data:a},{data:s}]=await Promise.all([supabase.from('admin_users').select('user_id').maybeSingle(),supabase.from('contest_settings').select('*').single()]);isAdmin=!!a;settings=s}
async function loadPublicContest(){publicContestError=null;publicCategoryError=null;publicContest=null;publicCategories=[];const {data,error}=await supabase.rpc('get_public_contest');if(error){publicContestError=error;return}publicContest=Array.isArray(data)?(data[0]||null):data;if(!publicContest)return;const result=await supabase.rpc('get_public_contest_categories',{p_contest_id:publicContest.id});if(result.error){publicCategoryError=result.error;return}publicCategories=result.data||[]}
async function loadParticipantContext(){participantError=null;submissionError=null;mediaError=null;participantId=null;submissionRows=[];mediaRows=[];if(!session||!publicContest)return;if(publicContestError)return;const {data:participation,error}=await supabase.rpc('ensure_contest_participation',{p_contest_id:publicContest.id});if(error){participantError=error;return}const resolved=Array.isArray(participation)?participation[0]:participation;participantId=resolved?.contest_participation_id||null;if(!participantId){participantError={message:'participation_not_resolved'};return}await loadSubmissions();await loadMedia()}
async function loadVoteState(){votedCategoryIds=new Set();voteStateError=null;if(!session||!publicContest||publicContest.status!=='VOTING_OPEN')return;const {data,error}=await supabase.rpc('get_my_voted_categories',{p_contest_id:publicContest.id});if(error){voteStateError=error;return}(data||[]).forEach(row=>{if(row?.category_id)votedCategoryIds.add(row.category_id)})}
async function loadSubmissions(){if(!participantId)return;const {data,error}=await supabase.from('submissions').select('id,category_id,status,rejection_reason,created_at,updated_at').eq('participation_id',participantId).order('created_at',{ascending:true});if(error){submissionError=error;return}submissionRows=data||[]}
async function loadMedia(){mediaRows=[];if(!submissionRows.length)return;const ids=submissionRows.map(s=>s.id);const {data,error}=await supabase.from('submission_media').select('id,submission_id,storage_bucket,storage_path,original_filename,mime_type,file_size_bytes,duration_seconds,version_no,status,is_current,created_at').in('submission_id',ids).order('version_no',{ascending:false});if(error){mediaError=error;return}mediaRows=data||[]}
function nav(){const tabs=isAdmin?[['home','Contest'],['admin','Amministra']]:[['home','Contest'],['upload','Candidatura']];return '<nav class="nav">'+tabs.map(([id,l])=>'<button class="btn '+(currentTab===id?'active':'')+'" data-tab="'+id+'">'+l+'</button>').join('')+'</nav>'}
function bindNav(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;render()})}
async function render(){syncAuthButtons();if(isAdmin&&currentTab==='upload')currentTab='admin';app.innerHTML=nav()+'<div id="view"><div class="spinner"></div></div>';bindNav();if(currentTab==='home')await homeView();if(currentTab==='upload'){if(session&&!participantId)await loadParticipantContext();await submissionView()}if(currentTab==='vote')await voteView();if(currentTab==='admin')await adminView()}
// Public gallery flow starts here; participant-flow tests intentionally stop before it.
function clearGalleryObjectUrls(){for(const url of galleryObjectUrls.values())URL.revokeObjectURL(url);galleryObjectUrls.clear()}
async function loadPublicGallery(){if(!publicContest||galleryLoadedContestId===publicContest.id)return;const contestId=publicContest.id,requestId=++galleryRequestSeq;galleryError=null;galleryRows=[];gallerySelectedCategoryId=null;galleryMediaErrors.clear();clearGalleryObjectUrls();const {data,error}=await supabase.from('published_submission_media').select('publication_id,submission_id,media_id,contest_id,category_id,published_at,storage_bucket,storage_path').eq('contest_id',contestId).order('published_at',{ascending:false});if(requestId!==galleryRequestSeq||publicContest?.id!==contestId)return;if(error){galleryError=error;return}galleryRows=(data||[]).filter(row=>row.contest_id===contestId&&publicCategories.some(category=>category.id===row.category_id));galleryLoadedContestId=contestId}
async function resolveGalleryMedia(row,requestId){if(galleryObjectUrls.has(row.media_id))return galleryObjectUrls.get(row.media_id);try{const {data,error}=await supabase.storage.from(row.storage_bucket).download(row.storage_path);if(error||!data)throw error||new Error('media_unavailable');const url=URL.createObjectURL(data);if(requestId!==galleryRequestSeq){URL.revokeObjectURL(url);return ''}galleryObjectUrls.set(row.media_id,url);return url}catch(error){if(requestId===galleryRequestSeq)galleryMediaErrors.set(row.media_id,error||new Error('media_unavailable'));return ''}}
const voteErrorLabel=error=>({email_verification_required:'Verifica la tua email per votare.',email_not_verified:'Questa email non è ancora verificata.',vote_already_cast:'Hai già votato in questa categoria.',voting_not_open:'La votazione non è aperta.',submission_not_public:'Questo video non è più disponibile.',submission_category_mismatch:'Il video non appartiene a questa categoria.',rate_limit:'Troppi tentativi. Attendi prima di riprovare.',invalid_otp:'Il codice OTP non è corretto o è scaduto.'}[String(error?.message||'').toLowerCase().match(/[a-z_]+/)?.[0]]||'Non è stato possibile completare l’operazione. Riprova.');
function voterSessionVerified(){return !!(session?.user?.email_confirmed_at||session?.user?.confirmed_at)}
function voteControls(row,category){if(publicContest?.status!=='VOTING_OPEN')return '';if(voteStateError)return msg('Non riesco a verificare lo stato del voto. Riprova più tardi.','error');if(votedCategoryIds.has(category.id))return '<div class="notice success">Hai già votato in questa categoria.</div>';return `<button class="btn primary wide votePublicBtn" data-public-vote="${esc(row.media_id)}">Vota questo video</button>`}
function openVoteDialog(row){if(publicContest?.status!=='VOTING_OPEN'||votedCategoryIds.has(row.category_id))return;voteTarget=row;renderVoteDialog()}
function renderVoteDialog(){const old=document.querySelector('#voteDialog');if(old)old.remove();if(!voteTarget)return;const category=publicCategories.find(c=>c.id===voteTarget.category_id);const needsOtp=!session||!voterSessionVerified();const dialog=document.createElement('section');dialog.id='voteDialog';dialog.className='card';dialog.innerHTML=`<div class="section-title"><div><div class="eyebrow">Verifica la tua email per votare</div><h2>${esc(category?.name||'Categoria')}</h2></div><button class="btn" id="closeVoteDialog">Chiudi</button></div><div id="voteDialogMsg"></div>${needsOtp&&!otpPending?`<form id="otpRequestForm"><label for="voterEmail">Email</label><input class="input" id="voterEmail" type="email" required value="${esc(otpEmail)}" autocomplete="email"><button class="btn primary wide" id="sendOtp">Invia codice OTP</button></form>`:''}${needsOtp&&otpPending?`<form id="otpVerifyForm"><p class="muted">Abbiamo inviato un codice a ${esc(otpEmail)}.</p><label for="otpCode">Codice OTP</label><input class="input" id="otpCode" inputmode="numeric" autocomplete="one-time-code" required><button class="btn primary wide" id="verifyOtp">Verifica email</button><button type="button" class="link wide" id="resendOtp">Invia di nuovo</button></form>`:''}${!needsOtp||otpVerified?`<div class="notice">Confermi il voto per questo video nella categoria <b>${esc(category?.name||'')}</b>? Il voto è definitivo e non potrà essere modificato.</div><button class="btn primary wide" id="confirmVote">Conferma voto definitivo</button>`:''}`;document.querySelector('#view').append(dialog);document.querySelector('#closeVoteDialog').onclick=()=>{voteTarget=null;otpEmail='';otpPending=false;otpVerified=false;dialog.remove()};const requestForm=document.querySelector('#otpRequestForm');if(requestForm)requestForm.onsubmit=sendVoteOtp;const verifyForm=document.querySelector('#otpVerifyForm');if(verifyForm)verifyForm.onsubmit=verifyVoteOtp;const resend=document.querySelector('#resendOtp');if(resend)resend.onclick=sendVoteOtp;const confirm=document.querySelector('#confirmVote');if(confirm)confirm.onclick=castVoteFromDialog}
async function sendVoteOtp(event){if(event?.preventDefault)event.preventDefault();if(otpRequestInFlight.value)return;const email=(document.querySelector('#voterEmail')?.value||otpEmail).trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){const box=document.querySelector('#voteDialogMsg');if(box)box.innerHTML=msg('Inserisci un indirizzo email valido.','error');return}otpEmail=email;otpRequestInFlight.value=true;const button=document.querySelector('#sendOtp')||document.querySelector('#resendOtp');if(button)button.disabled=true;const {error}=await supabase.auth.signInWithOtp({email,options:{shouldCreateUser:true}});otpRequestInFlight.value=false;if(error){const box=document.querySelector('#voteDialogMsg');if(box)box.innerHTML=msg(voteErrorLabel(error),'error');if(button)button.disabled=false;return}otpPending=true;renderVoteDialog()}

ter(m=>m.submission_id===s.id),current=versions.find(m=>m.is_current&&m.status==='FINALIZED'),prepared=versions.find(m=>m.status==='PREPARED'&&!m.is_current),active=publications.find(p=>p.submission_id===s.id&&!p.revoked_at),latest=publications.find(p=>p.submission_id===s.id),identity=identityByParticipation.get(s.participation_id),url=current?await adminSignedMedia(current):'',label=submissionStatusLabel[s.status]||s.status;return `<article class="card adminSubmission"><div class="adminSubmissionInfo"><div class="section-title"><div><b>${esc(identity?.display_name||'Partecipante')}</b><div class="muted">${identity?.contact_email?esc(identity.contact_email)+' · ':''}${s.creation_source==='ADMIN'?'Inserita dall’organizzazione':'Inserita dal partecipante'} · ${fmt(s.created_at)}</div></div><span class="badge ${String(s.status).toLowerCase()}">${esc(label)}</span></div>${s.rejection_reason?msg(s.rejection_reason,'error'):''}<div class="muted">Media: ${current?'FINALIZED · corrente':prepared?'PREPARED · in attesa di upload':'nessun media corrente'} · ${versions.length} versione/i</div><div class="muted">Publication: ${active?'attiva':latest?'revocata':'non pubblicata'}</div><div class="actions">${s.status==='PENDING'&&current?`<button class="btn primary adminModerate" data-id="${esc(s.id)}" data-decision="APPROVED">Approva</button><button class="btn danger adminModerate" data-id="${esc(s.id)}" data-decision="REJECTED">Rifiuta</button>`:''}${active?`<button class="btn danger adminRevoke" data-id="${esc(active.id)}">Revoca publication</button>`:''}</div>${prepared?`<form class="adminPreparedUpload" data-media-id="${esc(prepared.id)}" data-bucket="${esc(prepared.storage_bucket)}" data-path="${esc(prepared.storage_path)}" data-filename="${esc(prepared.original_filename)}" data-mime="${esc(prepared.mime_type)}" data-size="${prepared.file_size_bytes}"><label>Riprendi upload · ${esc(prepared.original_filename)}</label><input class="input" type="file" accept="video/mp4,video/webm,video/quicktime" required><button class="btn primary">Riprova upload/finalize</button></form>`:''}</div>${url?`<div><video controls preload="metadata" playsinline src="${esc(url)}"></video><a class="link" href="${esc(url)}" target="_blank" rel="noopener">Apri player grande</a></div>`:'<div class="publicVideoPoster" aria-label="Nessun media corrente">▶</div>'}</article>`}));return `<section class="adminModerationGroup"><header><b>${esc(category.name)}</b><span class="badge">${rows.length} candidature${category.is_active?'':' · inattiva'}</span></header>${rows.length?`<div class="adminSubmissionGrid">${cards.join('')}</div>`:'<div class="card empty">Nessuna candidatura in questa categoria.</div>'}</section>`}));view.innerHTML=`<section class="card"><div class="section-title"><div><h2>Moderazione Contest</h2><div class="muted">${submissions.length} candidature · raggruppate per categoria</div></div><span class="badge">${esc(publicContest.status)}</span></div><div id="adminMsg"></div><p class="muted">L’apertura del voto verifica readiness e pubblica atomicamente media APPROVED, FINALIZED e correnti tramite il backend.</p><button class="btn primary" id="openContestVoting" ${publicContest.status==='VOTING_OPEN'?'disabled':''}>${publicContest.status==='VOTING_OPEN'?'Votazione aperta':'Verifica readiness e apri votazione'}</button></section>${adminCategoryManager(categories)}${adminManualSubmissionForm(categories,identities)}<section>${groups.join('')}</section>`;bindAdminCategoryManager(categories);bindAdminManualSubmission();bindAdminPreparedUploads();const openVoting=document.querySelector('#openContestVoting');if(openVoting)openVoting.onclick=adminOpenContestVoting;document.querySelectorAll('.adminModerate').forEach(b=>b.onclick=()=>adminModerate(b.dataset.id,b.dataset.decision));document.querySelectorAll('.adminRevoke').forEach(b=>b.onclick=()=>adminRevoke(b.dataset.id));await renderAdminResults(view)}
const renderPublicGalleryCards=galleryView;galleryView=async function(){await renderPublicGalleryCards();if(!galleryActiveMediaId)return;let back=document.querySelector('#backPublicVideos');if(!back){back=document.createElement('button');back.id='backPublicVideos';back.className='btn categoryBack';back.textContent='← Torna ai video';(document.querySelector('.publicVideoDetail')||document.querySelector('#view')).prepend(back)}back.onclick=()=>{galleryActiveMediaId=null;galleryView()}};
function adminLifecycleActions(){const status=publicContest?.status;const actions={SUBMISSIONS_OPEN:['admin_close_contest_submissions','Chiudi candidature'],SUBMISSIONS_CLOSED:['admin_start_contest_moderation','Avvia moderazione'],MODERATION:['admin_mark_contest_ready_for_voting','Verifica readiness e prepara il voto'],READY_FOR_VOTING:['open_contest_voting','Apri votazione']};if(status==='VOTING_OPEN')return '<button class="btn primary" disabled>Votazione aperta</button>';const action=actions[status];return action?`<button class="btn primary" data-contest-transition="${action[0]}">${action[1]}</button>`:''}
async function adminRunContestTransition(rpcName){const key='contest-lifecycle';if(!session||!isAdmin||!publicContest||adminActionsInFlight.has(key))return;adminActionsInFlight.add(key);const button=document.querySelector('[data-contest-transition]'),box=document.querySelector('#adminMsg');if(button)button.disabled=true;try{const {data,error}=await supabase.rpc(rpcName,{p_contest_id:publicContest.id});if(error){if(box)box.innerHTML=msg(adminErrorLabel(error),'error');if(button)button.disabled=false;return}await loadPublicContest();if(session&&isAdmin)await adminView()}catch(error){if(box)box.innerHTML=msg('Connessione interrotta. Riprova.','error');if(button)button.disabled=false}finally{adminActionsInFlight.delete(key)}}
const adminViewBeforeLifecycle=adminView;
adminView=async function(){await adminViewBeforeLifecycle();if(!session||!isAdmin)return;const current=document.querySelector('#openContestVoting');if(!current)return;current.outerHTML=adminLifecycleActions();document.querySelectorAll('[data-contest-transition]').forEach(button=>button.onclick=()=>adminRunContestTransition(button.dataset.contestTransition))};
async function loadAdminContests(){const rpc=await supabase.rpc('admin_list_contests');if(!rpc.error){adminContestRows=rpc.data||[]}else{const direct=await supabase.from('contests').select('id,slug,name,description,status,created_at,updated_at').order('created_at',{ascending:false});if(direct.error)throw rpc.error;adminContestRows=direct.data||[]}if(!adminSelectedContestId)adminSelectedContestId=publicContest?.id||adminContestRows[0]?.id||null}
async function selectAdminContest(contest){publicContest=contest;publicCategories=[];const result=await supabase.rpc('get_public_contest_categories',{p_contest_id:contest.id});if(result.error)throw result.error;publicCategories=result.data||[];adminSelectedContestId=contest.id;currentTab='admin';await adminView()}
function adminContestManager(){const selected=adminContestRows.find(c=>c.id===adminSelectedContestId)||publicContest;return `<section class="card"><div class="section-title"><div><h2>Gestione Contest</h2><div class="muted">Creazione e configurazione riservate all’Admin; il Contest esistente non viene modificato.</div></div>${selected?`<span class="badge">${esc(selected.status)}</span>`:''}</div><div id="adminContestMsg"></div><form id="adminCreateContest" class="adminManualForm"><div><label>Nome nuovo Contest</label><input class="input" name="name" required maxlength="160"></div><div><label>Slug</label><input class="input" name="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*"></div><div class="wideField"><label>Descrizione</label><textarea class="input" name="description" rows="2"></textarea></div><button class="btn primary wideField">Crea Contest DRAFT</button></form><label>Contest Admin</label><select id="adminContestSelect" class="input">${adminContestRows.map(c=>`<option value="${esc(c.id)}" ${c.id===selected?.id?'selected':''}>${esc(c.name)} · ${esc(c.status)}</option>`).join('')}</select>${selected&&selected.status==='DRAFT'?`<form id="adminUpdateContest" class="adminManualForm"><div><label>Nome</label><input class="input" name="name" value="${esc(selected.name)}" required></div><div><label>Slug</label><input class="input" name="slug" value="${esc(selected.slug)}" required></div><div class="wideField"><label>Descrizione</label><textarea class="input" name="description" rows="2">${esc(selected.description||'')}</textarea></div><button class="btn">Salva Contest</button><button class="btn danger" type="button" id="adminDeleteContest">Elimina Contest vuoto</button></form>`:''}${selected&&selected.status==='DRAFT'?'<button class="btn primary" id="adminOpenSubmissions" style="margin-top:12px">Apri candidature</button>':''}</section>`}
function bindAdminContestManager(){const box=document.querySelector('#adminContestMsg'),showError=e=>{if(box)box.innerHTML=msg(e?.message||'Operazione Contest non riuscita.','error')};const select=document.querySelector('#adminContestSelect');if(select)select.onchange=async()=>{try{await selectAdminContest(adminContestRows.find(c=>c.id===select.value))}catch(e){showError(e)}};const create=document.querySelector('#adminCreateContest');if(create)create.onsubmit=async e=>{e.preventDefault();const f=e.currentTarget.elements;const {data,error}=await supabase.rpc('admin_create_contest',{p_slug:f.slug.value.trim(),p_name:f.name.value.trim(),p_description:f.description.value.trim()});if(error)return showError(error);await loadAdminContests();await selectAdminContest(Array.isArray(data)?data[0]:data)};const update=document.querySelector('#adminUpdateContest');if(update)update.onsubmit=async e=>{e.preventDefault();const f=e.currentTarget.elements,{data,error}=await supabase.rpc('admin_update_contest',{p_contest_id:adminSelectedContestId,p_slug:f.slug.value.trim(),p_name:f.name.value.trim(),p_description:f.description.value.trim()});if(error)return showError(error);await loadAdminContests();await selectAdminContest(Array.isArray(data)?data[0]:data)};const del=document.querySelector('#adminDeleteContest');if(del)del.onclick=async()=>{const {error}=await supabase.rpc('admin_delete_contest',{p_contest_id:adminSelectedContestId});if(error)return showError(error);await loadAdminContests();if(adminContestRows[0])await selectAdminContest(adminContestRows[0])};const open=document.querySelector('#adminOpenSubmissions');if(open)open.onclick=async()=>{open.disabled=true;const {data,error}=await supabase.rpc('admin_open_contest_submissions',{p_contest_id:adminSelectedContestId});if(error){open.disabled=false;return showError(error)}await loadAdminContests();await selectAdminContest(Array.isArray(data)?data[0]:data)}}
const adminViewWithContestManager=adminView;
adminView=async function(){try{await loadAdminContests();await adminViewWithContestManager();const view=document.querySelector('#view');if(!view)return;view.insertAdjacentHTML('afterbegin',adminContestManager());bindAdminContestManager()}catch(error){const view=document.querySelector('#view');if(view)view.innerHTML=msg(error?.message||'Superficie Admin Contest non disponibile.','error');console.error(error)}};
let adminManualRequestSeq=0,adminManualRecoveryRequired=false;
function adminManualError(error){return error?.code==='client_timeout'?error.message:(error?.message||'Inserimento manuale non riuscito. Riprova.')}
async function bindAdminManualSubmission(){const form=document.querySelector('#adminManualSubmission');if(!form)return;form.onsubmit=async e=>{e.preventDefault();const flowId=++adminManualRequestSeq,box=document.querySelector('#adminManualMsg'),button=e.submitter,file=form.elements.file.files[0],selection=form.elements.identity.value;adminTrace('click handler entered');if(!file)return;const key='admin-manual-submission';if(adminActionsInFlight.has(key))return;adminActionsInFlight.add(key);button.disabled=true;button.textContent='Invio…';try{if(adminManualRecoveryRequired){adminManualRecoveryRequired=false;adminTrace('recovery refresh started');await adminAwait(adminView(),'adminView refresh');if(box)box.innerHTML=msg('Stato aggiornato. Verifica la candidatura prima di riprovare.','notice');return}const metadata=adminFileMetadata(file);adminTrace('form/file validation passed');const requestSession=await adminSessionForSubmission();adminTrace('auth session resolved');adminEnsureSession(requestSession.user.id);let participationId=null,identityId=null;if(selection.startsWith('participation:'))participationId=selection.slice(14);else if(selection.startsWith('identity:'))identityId=selection.slice(9);const prepared=await adminRpc('admin_create_submission_with_media',{p_contest_id:publicContest.id,p_category_id:form.elements.category.value,p_participation_id:participationId,p_identity_id:identityId,p_display_name:form.elements.displayName.value.trim()||null,p_contact_email:form.elements.contactEmail.value.trim()||null,p_original_filename:file.name,p_mime_type:metadata.mimeType,p_file_size_bytes:file.size,p_duration_seconds:null},'create/stage RPC');adminEnsureSession(requestSession.user.id);if(prepared.error){adminTrace('create/stage RPC rejected',prepared.error.code||prepared.error.message);throw new Error(prepared.error.message)}adminTrace('create/stage RPC resolved');const media={...prepared.data,id:prepared.data.media_id,original_filename:file.name,mime_type:metadata.mimeType,file_size_bytes:file.size};await adminUploadAndFinalize(media,file,box);adminEnsureSession(requestSession.user.id);adminTrace('finalize resolved');adminTrace('adminView refresh started');try{await adminAwait(adminView(),'adminView refresh');if(flowId===adminManualRequestSeq)adminTrace('adminView refresh resolved')}catch(refreshError){adminTrace('adminView refresh rejected',refreshError.code||refreshError.message);throw refreshError}}catch(error){if(flowId!==adminManualRequestSeq)return;if(error.code==='client_timeout')adminManualRecoveryRequired=true;adminTrace('flow rejected',error.code||error.message);if(box)box.innerHTML=msg(adminManualError(error),'error')}finally{adminTrace('finally executed');adminActionsInFlight.delete(key);if(document.body.contains(button)){button.disabled=false;button.textContent='Crea candidatura e carica'}}}};
boot();
</script>
