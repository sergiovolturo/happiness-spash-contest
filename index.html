<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happiness SPASH Contest</title>
<meta name="description" content="Carica il tuo highlight SPASH e vota la giocata più spettacolare.">
<style>
:root{--brand:#0097b2;--brand2:#06b6d4;--ink:#071b22;--muted:#61747b;--line:#dbe8eb;--bg:#f3fafb;--white:#fff;--danger:#c2414d;--ok:#16835b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(150deg,#e9f9fb 0%,#fff 42%,#f2fafb 100%);color:var(--ink);min-height:100vh}
button,input,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1120px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 0 24px}
.brand{display:flex;align-items:center;gap:12px}.mark{width:46px;height:46px;border-radius:16px;background:var(--brand);display:grid;place-items:center;color:#fff;font-weight:900;font-size:21px;box-shadow:0 10px 25px #0097b233}.brand h1{font-size:18px;margin:0;line-height:1.1}.brand small{color:var(--muted)}
.card{background:#ffffffdd;border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 50px #075f7012;padding:24px}.auth{max-width:480px;margin:5vh auto}.auth h2{font-size:32px;margin:0 0 8px}.auth p{color:var(--muted);margin:0 0 24px}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 7px}.input{width:100%;border:1px solid #bfd5da;border-radius:14px;background:#fff;padding:13px 14px;outline:none}.input:focus{border-color:var(--brand);box-shadow:0 0 0 4px #0097b21c}
.btn{border:0;border-radius:14px;padding:12px 17px;font-weight:800;background:#e8f5f7;color:var(--ink)}.btn.primary{background:var(--brand);color:#fff;box-shadow:0 8px 20px #0097b232}.btn.danger{background:#fff0f1;color:var(--danger)}.btn:disabled{opacity:.48;cursor:not-allowed}.wide{width:100%;margin-top:18px}.link{border:0;background:none;color:var(--brand);font-weight:800;padding:8px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.nav .btn.active{background:var(--ink);color:#fff}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.hero{background:var(--ink);color:#fff;border-radius:28px;padding:28px;margin-bottom:18px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-70px;top:-80px;background:radial-gradient(circle,#08c8e888,transparent 68%)}.hero h2{font-size:clamp(28px,5vw,54px);max-width:680px;line-height:1;margin:0 0 12px}.hero p{color:#c4e2e7;max-width:620px;margin:0}.eyebrow{letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:#76d9e8;font-weight:900;margin-bottom:12px}
.stat{padding:18px}.stat b{display:block;font-size:30px}.stat span{color:var(--muted);font-size:14px}.section-title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:26px 0 12px}.section-title h2{margin:0}.muted{color:var(--muted)}.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.video-card{padding:0;overflow:hidden}.video-card video{width:100%;aspect-ratio:9/16;max-height:460px;background:#071b22;display:block}.video-body{padding:17px}.video-body h3{margin:0 0 3px}.badge{display:inline-flex;border-radius:99px;padding:5px 9px;font-size:12px;font-weight:800;background:#edf5f6;color:#4c6369}.badge.pending{background:#fff5d9;color:#8a6200}.badge.approved{background:#e7f8f1;color:var(--ok)}.badge.rejected{background:#ffedef;color:var(--danger)}
.upload-zone{border:2px dashed #a8ccd3;border-radius:18px;padding:28px;text-align:center;background:#f6fcfd}.checks label{display:flex;gap:10px;align-items:flex-start;font-weight:500}.checks input{margin-top:3px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.notice{border-radius:14px;padding:12px 14px;background:#eaf8fa;color:#075c6c;margin:12px 0}.error{background:#ffeff1;color:#982d3a}.success{background:#eaf8f1;color:#126942}.hidden{display:none!important}.spinner{width:22px;height:22px;border:3px solid #bce5eb;border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}.rank{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}
@media(max-width:760px){.shell{padding:14px}.grid,.grid.two{grid-template-columns:1fr}.card{border-radius:19px;padding:18px}.hero{padding:23px}.top{align-items:flex-start}.top .btn{padding:9px 11px}.video-card video{max-height:520px}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="brand"><div class="mark">H</div><div><h1>HAPPINESS × SPASH</h1><small>Highlight Contest</small></div></div><button id="logout" class="btn hidden">Esci</button></header>
<main id="app"><div class="spinner"></div></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js" onerror="document.getElementById('app').innerHTML='<div class=&quot;notice error&quot;>Impossibile caricare l’app. Aggiorna la pagina oppure prova senza blocco pubblicità.</div>'"></script>
<script>
const supabase=window.supabase.createClient('https://pkaadvqyrdxgymzzugvo.supabase.co','sb_publishable_Yru2Ftclbaq6n-7laSrP_A_su230R5h');
const app=document.querySelector('#app'), logout=document.querySelector('#logout');
let session=null,isAdmin=false,settings=null,currentTab='home';
let publicContest=null,publicCategories=[],participantId=null,submissionRows=[];
let publicContestError=null,publicCategoryError=null,participantError=null,submissionError=null;
let authReady=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const msg=(text,type='notice')=>'<div class="notice '+type+'">'+esc(text)+'</div>';
const fmt=n=>new Intl.DateTimeFormat('it-IT',{dateStyle:'medium',timeStyle:'short'}).format(new Date(n));
async function boot(){try{await loadPublicContest();const {data,error}=await supabase.auth.getSession();if(error)throw error;session=data.session;authReady=true;if(!session)return authView();await loadContext();await loadParticipantContext();render()}catch(error){authReady=true;app.innerHTML=msg('Errore di collegamento. Aggiorna la pagina e riprova.','error');console.error(error)}}
supabase.auth.onAuthStateChange(async(_,s)=>{session=s;if(!authReady)return;if(s){await loadContext();await loadParticipantContext();render()}else{participantId=null;submissionRows=[];authView()}});
logout.onclick=async()=>supabase.auth.signOut();
function authView(){logout.classList.add('hidden');app.innerHTML=`
<section class="card auth"><div class="eyebrow">Happiness SPASH Contest</div><h2 id="authTitle">Entra nel contest.</h2><p id="authSub">Accedi per caricare i tuoi highlight e votare.</p><div id="authMsg"></div>
<form id="loginForm"><div id="registerFields" class="hidden"><label>Nome e cognome</label><input class="input" id="fullName" autocomplete="name"><label>Profilo Instagram</label><input class="input" id="instagram" placeholder="@username"></div>
<label>Email</label><input class="input" id="email" type="email" required autocomplete="email"><label>Password</label><input class="input" id="password" type="password" required minlength="8" autocomplete="current-password">
<button class="btn primary wide" id="authSubmit">Accedi</button></form><button class="link wide" id="toggleAuth">Non hai un account? Registrati</button></section>`;
let register=false;document.querySelector('#toggleAuth').onclick=()=>{register=!register;document.querySelector('#registerFields').classList.toggle('hidden',!register);document.querySelector('#authTitle').textContent=register?'Crea il tuo account.':'Entra nel contest.';document.querySelector('#authSubmit').textContent=register?'Registrati':'Accedi';document.querySelector('#toggleAuth').textContent=register?'Hai già un account? Accedi':'Non hai un account? Registrati';document.querySelector('#password').autocomplete=register?'new-password':'current-password'};
document.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();const box=document.querySelector('#authMsg'),btn=document.querySelector('#authSubmit');btn.disabled=true;box.innerHTML='';const email=document.querySelector('#email').value.trim(),password=document.querySelector('#password').value;let error;
if(register){const full_name=document.querySelector('#fullName').value.trim();if(full_name.length<2){box.innerHTML=msg('Inserisci nome e cognome.','error');btn.disabled=false;return}({error}=await supabase.auth.signUp({email,password,options:{emailRedirectTo:'https://gabrieledellatti22.github.io/happiness-spash-contest/',data:{full_name,instagram_handle:document.querySelector('#instagram').value.trim()}}}));if(!error)box.innerHTML=msg('Registrazione completata. Controlla la tua email per confermare l’account.','success')}
else({error}=await supabase.auth.signInWithPassword({email,password}));
if(error)box.innerHTML=msg(error.message,'error');btn.disabled=false};
}
async function loadContext(){logout.classList.remove('hidden');const [{data:a},{data:s}]=await Promise.all([supabase.from('admin_users').select('user_id').maybeSingle(),supabase.from('contest_settings').select('*').single()]);isAdmin=!!a;settings=s}
async function loadPublicContest(){publicContestError=null;publicCategoryError=null;publicContest=null;publicCategories=[];const {data,error}=await supabase.rpc('get_public_contest');if(error){publicContestError=error;return}publicContest=Array.isArray(data)?(data[0]||null):data;if(!publicContest)return;const result=await supabase.rpc('get_public_contest_categories',{p_contest_id:publicContest.id});if(result.error){publicCategoryError=result.error;return}publicCategories=result.data||[]}
async function loadParticipantContext(){participantError=null;submissionError=null;participantId=null;submissionRows=[];if(!session||!publicContest)return;if(publicContestError)return;const {data:participation,error}=await supabase.rpc('ensure_contest_participation',{p_contest_id:publicContest.id});if(error){participantError=error;return}const resolved=Array.isArray(participation)?participation[0]:participation;participantId=resolved?.contest_participation_id||null;if(!participantId){participantError={message:'participation_not_resolved'};return}await loadSubmissions()}
async function loadSubmissions(){if(!participantId)return;const {data,error}=await supabase.from('submissions').select('id,category_id,status,rejection_reason,created_at,updated_at').eq('participation_id',participantId).order('created_at',{ascending:true});if(error){submissionError=error;return}submissionRows=data||[]}
function nav(){return '<nav class="nav">'+[['home','Contest'],['upload','Candidatura'],['vote','Vota'],...(isAdmin?[['admin','Amministra']]:[])].map(([id,l])=>'<button class="btn '+(currentTab===id?'active':'')+'" data-tab="'+id+'">'+l+'</button>').join('')+'</nav>'}
function bindNav(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;render()})}
async function render(){app.innerHTML=nav()+'<div id="view"><div class="spinner"></div></div>';bindNav();if(currentTab==='home')homeView();if(currentTab==='upload')await submissionView();if(currentTab==='vote')await voteView();if(currentTab==='admin')await adminView()}
function homeView(){document.querySelector('#view').innerHTML=`<section class="hero"><div class="eyebrow">La tua giocata. Il voto della community.</div><h2>Partecipa al Contest.</h2><p>Scegli la categoria del Contest corrente e crea la tua candidatura. Il caricamento del video sarà disponibile in una fase successiva.</p></section><div class="grid"><div class="card stat"><b>${publicCategories.length}</b><span>categorie disponibili</span></div><div class="card stat"><b>${esc(publicContest?.status||'—')}</b><span>stato Contest</span></div><div class="card stat"><b>${submissionRows.length}</b><span>candidature create</span></div></div>`}
// New participant domain flow: Contest, categories, participation and submissions.
const submissionStatusLabel={PENDING:'In attesa di moderazione',APPROVED:'Approvata',REJECTED:'Rifiutata',WITHDRAWN:'Ritirata',CANCELLED:'Annullata'};
const submissionErrorLabel=error=>({contest_not_open:'Le candidature non sono aperte.',category_full:'La categoria ha raggiunto il cap.',submission_already_exists:'Hai già una candidatura per questa categoria.',category_inactive:'La categoria non è disponibile.',contest_category_mismatch:'La categoria non appartiene al Contest.',participation_not_active:'La partecipazione non è attiva.',contest_not_found:'Il Contest non è disponibile.',unauthorized:'La sessione non è autorizzata.'}[String(error?.message||'').match(/[a-z_]+/)?.[0]]||'Non è stato possibile completare la candidatura. Riprova.');
async function submissionView(){const view=document.querySelector('#view');if(publicContestError)return view.innerHTML=msg('Non riesco a caricare il Contest. Riprova più tardi.','error');if(!publicContest)return view.innerHTML=msg('Non ci sono Contest disponibili al momento.','notice');if(publicCategoryError)return view.innerHTML=msg('Non riesco a caricare le categorie. Riprova più tardi.','error');if(participantError)return view.innerHTML=msg('Non riesco a preparare la tua partecipazione. Riprova più tardi.','error');const rows=submissionRows||[];view.innerHTML=`<section class="card"><div class="section-title"><div><h2>${esc(publicContest.name)}</h2><div class="muted">Scegli una categoria e crea la tua candidatura.</div></div><span class="badge">${esc(publicContest.status)}</span></div><div id="submissionMsg">${submissionError?msg('Non riesco a caricare le tue candidature. Riprova più tardi.','error'):''}</div><form id="submissionForm"><label for="category">Categoria</label><select class="input" id="category" required><option value="">Seleziona una categoria</option>${publicCategories.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}${c.submission_cap?` · cap ${c.submission_cap}`:''}</option>`).join('')}</select><button class="btn primary wide" ${!participantId||!publicCategories.length?'disabled':''}>Crea candidatura</button></form></section><section><div class="section-title"><div><h2>Le tue candidature</h2><div class="muted">Stato reale della submission nel nuovo dominio.</div></div></div><div class="grid" style="grid-template-columns:1fr">${rows.length?rows.map(r=>{const category=publicCategories.find(c=>c.id===r.category_id);const label=submissionStatusLabel[r.status]||r.status;return `<article class="card"><div style="display:flex;justify-content:space-between;gap:12px"><div><b>${esc(category?.name||'Categoria')}</b><div class="muted">${fmt(r.created_at)}</div></div><span class="badge ${String(r.status).toLowerCase()}">${esc(label)}</span></div>${r.rejection_reason?msg(r.rejection_reason,'error'):''}</article>`}).join(''):'<div class="card empty">Non hai ancora creato candidature.</div>'}</div></section>`;document.querySelector('#submissionForm').onsubmit=createSubmission}
async function createSubmission(event){event.preventDefault();const box=document.querySelector('#submissionMsg'),button=event.submitter,categoryId=document.querySelector('#category').value;box.innerHTML='';if(!categoryId)return;button.disabled=true;button.textContent='Invio…';const {data,error}=await supabase.rpc('create_submission',{p_participation_id:participantId,p_category_id:categoryId});if(error){box.innerHTML=msg(submissionErrorLabel(error),'error');button.disabled=false;button.textContent='Crea candidatura';return}const created=Array.isArray(data)?data[0]:data;if(created)submissionRows=[...submissionRows,created];box.innerHTML=msg('Candidatura creata.','success');await loadSubmissions();await submissionView()}
// Legacy media flow remains below for later migration and is not called by the new participant flow.
async function uploadView(){const {data:videos,error}=await supabase.from('videos').select('*').order('slot');if(error)return document.querySelector('#view').innerHTML=msg(error.message,'error');const used=new Set((videos||[]).map(v=>v.slot));document.querySelector('#view').innerHTML=`<div class="grid two"><section class="card"><div class="section-title"><div><h2>Carica un highlight</h2><div class="muted">MP4, WebM o MOV · massimo 10 secondi e 10 MB</div></div></div><div id="uploadMsg"></div>
<form id="uploadForm"><label>Spazio candidatura</label><select class="input" id="slot" required><option value="">Seleziona</option><option value="1" ${used.has(1)?'disabled':''}>Video 1 ${used.has(1)?'— già usato':''}</option><option value="2" ${used.has(2)?'disabled':''}>Video 2 ${used.has(2)?'— già usato':''}</option></select>
<label>Nome del protagonista</label><input class="input" id="participant" required minlength="2"><label>Profilo Instagram</label><input class="input" id="ig" placeholder="@username">
<label>Video</label><div class="upload-zone"><input id="file" type="file" accept="video/mp4,video/webm,video/quicktime" required><div class="muted" style="margin-top:8px">La durata viene controllata prima del caricamento.</div></div>
<div class="checks"><label><input type="checkbox" id="c1" required> Autorizzo il Centro Sportivo Happiness a pubblicare e utilizzare il filmato per il contest e la relativa comunicazione.</label><label><input type="checkbox" id="c2" required> Confermo di aver informato le altre persone riconoscibili nel video.</label><label><input type="checkbox" id="c3" required> Accetto il regolamento e dichiaro che il video è stato registrato tramite SPASH presso il Centro Sportivo Happiness.</label></div>
<button class="btn primary wide" ${!settings?.submissions_open||used.size>=2?'disabled':''}>${settings?.submissions_open?'Invia per l’approvazione':'Candidature chiuse'}</button></form></section>
<section><div class="section-title"><div><h2>I tuoi video</h2><div class="muted">${videos?.length||0} di 2 caricati</div></div></div><div class="grid" style="grid-template-columns:1fr">${videos?.length?videos.map(v=>`<article class="card"><div style="display:flex;justify-content:space-between;gap:12px"><div><b>Video ${v.slot}</b><div class="muted">${fmt(v.created_at)}</div></div><span class="badge ${v.status}">${v.status==='pending'?'In revisione':v.status==='approved'?'Approvato':'Rifiutato'}</span></div>${v.rejection_reason?msg(v.rejection_reason,'error'):''}</article>`).join(''):'<div class="card empty">Non hai ancora caricato video.</div>'}</div></section></div>`;
document.querySelector('#uploadForm').onsubmit=handleUpload}
function videoDuration(file){return new Promise((resolve,reject)=>{const v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>{URL.revokeObjectURL(v.src);resolve(v.duration)};v.onerror=reject;v.src=URL.createObjectURL(file)})}
async function handleUpload(e){e.preventDefault();const btn=e.submitter,box=document.querySelector('#uploadMsg'),file=document.querySelector('#file').files[0];box.innerHTML='';if(file.size>10485760)return box.innerHTML=msg('Il video supera 10 MB.','error');let duration;try{duration=await videoDuration(file)}catch{return box.innerHTML=msg('Non riesco a leggere questo video.','error')}if(duration>10.15)return box.innerHTML=msg('Il video supera i 10 secondi.','error');btn.disabled=true;btn.textContent='Caricamento…';const slot=Number(document.querySelector('#slot').value),safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=session.user.id+'/'+slot+'-'+Date.now()+'-'+safe;
const {error:upErr}=await supabase.storage.from('contest-videos').upload(path,file,{contentType:file.type,upsert:false});if(upErr){box.innerHTML=msg(upErr.message,'error');btn.disabled=false;btn.textContent='Invia per l’approvazione';return}
const {error}=await supabase.from('videos').insert({user_id:session.user.id,slot,participant_name:document.querySelector('#participant').value.trim(),instagram_handle:document.querySelector('#ig').value.trim()||null,video_path:path,original_filename:file.name,file_size_bytes:file.size,duration_seconds:Number(duration.toFixed(2)),consent_publication:true,consent_other_people:true,consent_rules:true});
if(error){await supabase.storage.from('contest-videos').remove([path]);box.innerHTML=msg(error.message,'error');btn.disabled=false;return}box.innerHTML=msg('Video inviato. Sarà visibile dopo l’approvazione.','success');setTimeout(()=>render(),900)}
async function signed(path){const {data}=await supabase.storage.from('contest-videos').createSignedUrl(path,3600);return data?.signedUrl||''}
async function voteView(){const [{data:videos,error},{data:mine}]=await Promise.all([supabase.from('videos').select('*').eq('status','approved'),supabase.from('votes').select('video_id').maybeSingle()]);if(error)return document.querySelector('#view').innerHTML=msg(error.message,'error');const shuffled=[...(videos||[])].sort(()=>Math.random()-.5);const urls=await Promise.all(shuffled.map(v=>signed(v.video_path)));document.querySelector('#view').innerHTML=`<div class="section-title"><div><h2>Vota il tuo highlight preferito</h2><div class="muted">${settings?.voting_open?'Hai un solo voto: scegli con attenzione.':'La votazione non è ancora aperta.'}</div></div></div><div id="voteMsg">${mine?msg('Hai già espresso il tuo voto.','success'):''}</div><div class="grid">${shuffled.length?shuffled.map((v,i)=>`<article class="card video-card"><video controls preload="metadata" playsinline src="${urls[i]}"></video><div class="video-body"><span class="badge">Video #${v.id}</span><h3>${esc(v.participant_name)}</h3><div class="muted">${esc(v.instagram_handle||'')}</div><button class="btn primary wide voteBtn" data-id="${v.id}" ${!settings?.voting_open||mine?'disabled':''}>Vota questo video</button></div></article>`).join(''):'<div class="card empty">Nessun video approvato disponibile.</div>'}</div>`;document.querySelectorAll('.voteBtn').forEach(b=>b.onclick=()=>castVote(Number(b.dataset.id)))}
async function castVote(video_id){if(!confirm('Confermi il voto? Non potrai modificarlo.'))return;const {error}=await supabase.from('votes').insert({voter_id:session.user.id,video_id});document.querySelector('#voteMsg').innerHTML=error?msg(error.message,'error'):msg('Voto registrato correttamente.','success');if(!error)document.querySelectorAll('.voteBtn').forEach(b=>b.disabled=true)}
async function adminView(){if(!isAdmin)return document.querySelector('#view').innerHTML=msg('Accesso non autorizzato.','error');const [{data:videos},{data:votes}]=await Promise.all([supabase.from('videos').select('*').order('created_at'),supabase.from('votes').select('*')]);const urls=await Promise.all((videos||[]).map(v=>signed(v.video_path)));const counts={};(votes||[]).forEach(v=>counts[v.video_id]=(counts[v.video_id]||0)+1);const ranking=(videos||[]).filter(v=>v.status==='approved').sort((a,b)=>(counts[b.id]||0)-(counts[a.id]||0));
document.querySelector('#view').innerHTML=`<section class="card"><div class="section-title"><div><h2>Gestione contest</h2><div class="muted">Le modifiche sono immediate.</div></div></div><div class="actions"><button class="btn" id="toggleSubs">Candidature: ${settings.submissions_open?'APERTE':'CHIUSE'}</button><button class="btn" id="toggleVote">Voto: ${settings.voting_open?'APERTO':'CHIUSO'}</button></div></section>
<div class="section-title"><div><h2>Classifica privata</h2><div class="muted">${votes?.length||0} voti registrati</div></div></div><section class="card">${ranking.length?ranking.slice(0,6).map((v,i)=>`<div class="rank"><span><b>#${i+1}</b> · ${esc(v.participant_name)}</span><b>${counts[v.id]||0} voti</b></div>`).join(''):'<div class="empty">Nessun voto disponibile.</div>'}</section>
<div class="section-title"><div><h2>Candidature</h2><div class="muted">${videos?.length||0} video</div></div></div><div class="grid">${(videos||[]).map((v,i)=>`<article class="card video-card"><video controls preload="metadata" src="${urls[i]}"></video><div class="video-body"><span class="badge ${v.status}">${v.status}</span><h3>${esc(v.participant_name)}</h3><div class="muted">${esc(v.instagram_handle||'')} · Video ${v.slot}</div><div class="actions"><button class="btn primary review" data-id="${v.id}" data-status="approved">Approva</button><button class="btn danger review" data-id="${v.id}" data-status="rejected">Rifiuta</button></div></div></article>`).join('')}</div>`;
document.querySelector('#toggleSubs').onclick=()=>updateSettings({submissions_open:!settings.submissions_open});document.querySelector('#toggleVote').onclick=()=>updateSettings({voting_open:!settings.voting_open});document.querySelectorAll('.review').forEach(b=>b.onclick=()=>review(Number(b.dataset.id),b.dataset.status))}
async function review(id,status){let rejection_reason=null;if(status==='rejected')rejection_reason=prompt('Motivo del rifiuto:')||'Video non conforme al regolamento.';const {error}=await supabase.from('videos').update({status,rejection_reason,reviewed_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else render()}
async function updateSettings(patch){const {error}=await supabase.from('contest_settings').update({...patch,updated_at:new Date().toISOString()}).eq('singleton',true);if(error)alert(error.message);else{settings={...settings,...patch};render()}}
boot();
</script>
</body></html>
