<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAPPINESS SPASH CONTEST — proposta UI raffinata</title><style>
:root{--paper:#F7F7F5;--white:#fff;--ink:#111;--yellow:#FFD900;--muted:#6d6d68;--line:#deded8;--soft:#efefea;--radius:18px}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:1120px;margin:auto;padding:14px 20px 60px}.prototype-note{font-size:11px;color:#655900;letter-spacing:.08em;text-align:center;text-transform:uppercase;padding:7px 10px;border:1px solid #e2d45b;background:#fffbe0;border-radius:99px}.topbar{display:flex;align-items:center;gap:18px;padding:18px 0;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;margin-right:auto}.mark{width:40px;height:40px;display:grid;place-items:center;border-radius:11px;background:var(--yellow);font-weight:950;font-size:23px}.brand strong{font-size:14px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.16em;text-transform:uppercase}.nav{display:flex;gap:5px;background:#e8e8e3;padding:4px;border-radius:99px}.nav button,.ghost,.link{border:0;background:transparent;color:var(--ink);border-radius:99px;padding:9px 15px;cursor:pointer;font:inherit}.nav button.active,.primary{background:#000;color:#fff;font-weight:750}.admin-link{color:var(--muted);font-size:12px;cursor:pointer}.view{padding-top:26px}.eyebrow{font-size:10px;font-weight:850;letter-spacing:.18em;text-transform:uppercase;color:#625800}.hero{display:grid;grid-template-columns:1fr .8fr;gap:34px;align-items:center}.hero h1{font-size:clamp(36px,6vw,68px);line-height:.95;letter-spacing:-.06em;margin:10px 0 16px}.hero h1 span{background:var(--yellow);padding:0 7px}.lead{max-width:550px;color:#4e4e49;font-size:17px}.actions{display:flex;gap:10px;align-items:center;margin-top:20px}.primary{border:0;border-radius:10px;padding:12px 18px;cursor:pointer}.hero-art{height:260px;border-radius:24px;border:1px solid #d3c100;background:linear-gradient(90deg,#0008,#0000 70%),url('assets/padel-hero.png') center/cover;position:relative}.hero-art:after{content:"SPASH CONTEST";white-space:pre;position:absolute;bottom:22px;left:22px;color:#fff;font-size:22px;font-weight:900;line-height:1}.section{margin-top:32px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:12px}.section h2{font-size:23px;margin:4px 0}.schedule{display:flex;gap:28px;flex-wrap:wrap;padding:17px 19px;background:#fff;border:1px solid var(--line);border-radius:var(--radius)}.schedule b{display:block;color:#5c5200;font-size:10px;letter-spacing:.12em;text-transform:uppercase}.schedule span{white-space:nowrap}.badge{font-size:11px;border-radius:99px;padding:5px 9px;background:#fff5a8;color:#4f4600;font-weight:750}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}.category-art{height:145px;background:linear-gradient(90deg,#0008,#0000 70%),url('assets/padel-card.png') center/cover;position:relative}.category-art:after{content:"";position:absolute;right:16px;bottom:14px;width:38px;height:38px;border:2px solid #fff;border-radius:50%}.category-body{padding:16px}.category h3{font-size:20px;margin:0 0 5px}.meta{display:flex;gap:11px;flex-wrap:wrap;color:var(--muted);font-size:13px}.category .primary{width:100%;margin-top:14px;background:var(--yellow);color:#111}.detail-head{display:flex;gap:13px;align-items:center;margin-bottom:19px}.detail-head h1{margin:0;font-size:36px}.back{background:#fff;border:1px solid var(--line)}.video{aspect-ratio:16/9;border-radius:15px;background:linear-gradient(#0003,#0005),url('assets/padel-card.png') center/cover;display:grid;place-items:center}.video span{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#111;font-size:22px}.video-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.video-card{padding:10px;background:#fff;border:1px solid var(--line);border-radius:var(--radius)}.video-card h3{margin:12px 3px 2px}.video-card .primary{width:100%;margin-top:12px;background:var(--soft);color:#8b8b85;cursor:default}.form-wrap{max-width:540px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:25px}.form-wrap h1{font-size:39px;line-height:1;margin:8px 0 12px}.form-wrap p{color:var(--muted)}.form-wrap label{display:block;font-weight:750;margin:17px 0 6px}.form-wrap input{width:100%;padding:12px 13px;border:1px solid #bbbdb5;border-radius:10px;background:#fff;color:#111;font:inherit}.form-note{border-left:3px solid var(--yellow);background:#fffbe0;padding:13px;margin-top:18px}.admin-shell{display:grid;grid-template-columns:195px 1fr;gap:18px}.side{display:grid;gap:5px;align-self:start}.side button{text-align:left;padding:11px 13px;border:0;border-radius:10px;background:transparent;cursor:pointer}.side button.active{background:var(--yellow);font-weight:800}.submission{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding:17px;background:#fff;border:1px solid var(--line);border-radius:var(--radius)}.states{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.state-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px}.footer{margin-top:34px;border-top:1px solid var(--line);padding-top:14px;color:#8b8b85;font-size:12px}@media(max-width:760px){.shell{padding:11px 14px 44px}.topbar{flex-wrap:wrap}.brand{margin-right:0}.nav{order:3;width:100%}.nav button{flex:1}.hero{grid-template-columns:1fr}.hero-art{height:190px}.hero h1{font-size:50px}.schedule{display:grid;gap:12px}.schedule span{white-space:normal}.grid,.video-grid,.submission,.admin-shell,.states{grid-template-columns:1fr}.side{display:flex;overflow:auto}.side button{white-space:nowrap}.form-wrap h1{font-size:34px}}
</style></head><body><div class="shell"><div class="prototype-note">Proposta UI isolata · dati mock · nessuna write</div><header class="topbar"><div class="brand"><div class="mark">H</div><div><strong>HAPPINESS SPASH CONTEST</strong><small>contest platform</small></div></div><nav class="nav"><button class="active" data-screen="contest">CONTEST</button><button data-screen="candidatura">CANDIDATURA</button></nav><span class="admin-link" data-screen="auth">Accesso Admin</span></header><main id="app" class="view"></main><footer class="footer">Prototipo visivo basato sulle schermate reali dell'app. Nessuna autenticazione, upload o azione persistente.</footer></div><script>
const app=document.querySelector('#app'),nav=[...document.querySelectorAll('[data-screen]')];const card=(name,meta)=>`<article class="card"><div class="category-art"></div><div class="category-body"><h3>${name}</h3><div class="meta"><span>▱ ${meta}</span><span>29 posti disponibili</span></div><button class="primary" data-screen="category">Guarda i video →</button></div></article>`;function render(screen='contest'){nav.forEach(b=>b.classList.toggle('active',b.dataset.screen===screen));let html='';if(screen==='contest')html=`<section class="hero"><div><div class="eyebrow">HAPPINESS SPASH CONTEST · CONTEST TEST 2</div><h1>Contest <span>TEST 2</span></h1><p class="lead">Cattura un momento memorabile, carica e condividi il tuo video e partecipa alla competizione del Contest.</p><div class="actions"><button class="primary" data-screen="candidatura">Candidati ora</button><button class="ghost" data-screen="category">Esplora categorie</button></div></div><div class="hero-art" aria-label="Decorazione visiva"></div></section><section class="section"><div class="section-head"><div><div class="eyebrow">Contest</div><h2>Contest TEST 2</h2></div><span class="badge">Candidature chiuse</span></div><div class="schedule"><div><b>Candidature</b><span>29 set 2026, 13:00 → 30 set 2026, 12:00</span></div><div><b>Votazioni</b><span>30 set 2026, 13:00 → 5 ott 2026, 12:00</span></div></div></section><section class="section"><div class="section-head"><div><div class="eyebrow">Categorie</div><h2>Scopri i video</h2></div><button class="ghost" data-screen="category">Tutte le categorie</button></div><div class="grid">${card('SMASH PIU BELLO','1 video pubblicato')}${card('SMASH PIU BELLO con foto','0 video pubblicati')}</div></section>`;else if(screen==='candidatura')html=`<section class="form-wrap"><div class="eyebrow">Candidatura · Contest TEST 2</div><h1>Candidature chiuse.</h1><p>Il periodo è terminato il 30 set 2026, 12:00.</p><div class="form-note">La verifica email e il caricamento del video saranno disponibili quando si aprirà una nuova finestra candidature.</div><div class="actions"><button class="primary" data-screen="contest">Torna al Contest</button><button class="ghost" data-screen="open">Anteprima finestra aperta</button></div></section>`;else if(screen==='open')html=`<section class="form-wrap"><div class="eyebrow">Candidatura · finestra aperta</div><h1>Verifica prima la tua email.</h1><p>Inserisci la tua email per ricevere un codice e iniziare la candidatura.</p><label>Email</label><input type="email" placeholder="nome@esempio.it"><div class="actions"><button class="primary" data-screen="verified">Invia codice</button><button class="ghost" data-screen="contest">Annulla</button></div></section>`;else if(screen==='verified')html=`<section class="form-wrap"><div class="eyebrow">Candidatura · identità verificata</div><h1>La tua candidatura</h1><p>Completa i dati della candidatura e carica il video.</p><label>Nome candidato/protagonista</label><input placeholder="Nome mostrato pubblicamente"><label>Categoria</label><input value="SMASH PIU BELLO" readonly><label>Video</label><div class="form-note">Seleziona il video da caricare secondo le regole del Contest.</div><div class="actions"><button class="primary">Invia candidatura</button></div></section>`;else if(screen==='category')html=`<div class="detail-head"><button class="ghost back" data-screen="contest">← Tutte le categorie</button><div><div class="eyebrow">Contest TEST 2</div><h1>SMASH PIU BELLO</h1></div></div><p class="lead">Il punto più spettacolare: tecnica, potenza, creatività e stile.</p><div class="video-grid"><article class="video-card"><div class="video"><span>▶</span></div><h3>Matteo Volturo</h3><div class="meta">29 set 2026 · video pubblicato</div><button class="primary">Votazioni dal 30 set 2026</button></article><article class="video-card"><div class="video"><span>▶</span></div><h3>Luca Bianchi</h3><div class="meta">Video pubblicato</div><button class="primary">Votazioni dal 30 set 2026</button></article></div>`;else if(screen==='auth')html=`<section class="form-wrap"><div class="eyebrow">HAPPINESS SPASH CONTEST</div><h1>Accesso Admin</h1><p>Accedi per configurare e gestire i contest.</p><label>Email</label><input type="email" placeholder="Inserisci la tua email"><label>Password</label><input type="password" placeholder="Inserisci la tua password"><div class="actions"><button class="primary">Accedi</button><span class="link" data-screen="recovery">Password dimenticata?</span></div><p class="link" data-screen="contest">← Torna al contest</p></section>`;else if(screen==='recovery')html=`<section class="form-wrap"><div class="eyebrow">Accesso Admin</div><h1>Password dimenticata?</h1><p>Inserisci la tua email per ricevere il link di recupero.</p><label>Email</label><input type="email"><div class="actions"><button class="primary">Invia link</button><button class="ghost" data-screen="auth">Indietro</button></div></section>`;else if(screen==='admin')html=`<section><div class="eyebrow">Amministra · Contest TEST 2</div><h1>Workspace Admin</h1><div class="admin-shell"><aside class="side"><button class="active">Candidature</button><button>Contest</button><button>Risultati</button><button>Impostazioni</button></aside><div><div class="section-head"><h2>Candidature</h2><span class="badge">2 da verificare</span></div><article class="submission"><div><div class="eyebrow">Nome candidato/protagonista</div><h2>Matteo Volturo</h2><p class="muted">Inserita dal partecipante · SMASH PIU BELLO</p><span class="badge">APPROVED</span></div><div><div class="video"><span>▶</span></div><div class="actions"><button class="primary">Approva</button><button class="ghost">Rifiuta</button></div></div></article></div></div></section>`;else html=`<section><div class="eyebrow">Stati dell'app</div><h1>Loading, empty, error</h1><div class="states"><div class="state-card"><h2>Caricamento</h2><p class="muted">Caricamento in corso…</p></div><div class="state-card"><h2>Nessun video</h2><p class="muted">Nessun video pubblicato.</p></div><div class="state-card"><h2>Errore</h2><p class="muted">Impossibile caricare questa schermata. Riprova.</p></div></div></section>`;app.innerHTML=html;app.querySelectorAll('[data-screen]').forEach(b=>b.addEventListener('click',()=>render(b.dataset.screen)))}nav.forEach(b=>b.addEventListener('click',()=>render(b.dataset.screen)));render();</script></body></html>
