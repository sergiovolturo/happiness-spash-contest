<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HAPPINESS SPASH CONTEST — prototipo dark</title>
<style>
:root{--yellow:#FFD900;--ink:#111;--black:#000;--paper:#F7F7F5;--muted:#a6a6a2;--line:#343434;--card:#171717;--radius:22px}*{box-sizing:border-box}body{margin:0;background:var(--black);color:var(--paper);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1180px;margin:auto;padding:18px 22px 60px}.notice{border:1px solid #574d00;color:#e9d900;background:#181500;border-radius:999px;padding:7px 13px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-align:center;margin-bottom:16px}.topbar{display:flex;align-items:center;gap:18px;padding:12px 0 22px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px;margin-right:auto}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--yellow);color:var(--black);font-weight:950;font-size:24px}.brand strong{display:block;font-size:14px;letter-spacing:.04em}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.18em;text-transform:uppercase}.nav{display:flex;gap:7px}.nav button,.ghost,.back{border:1px solid var(--line);background:#151515;color:var(--paper);border-radius:999px;padding:9px 15px}.nav button.active,.primary{background:var(--yellow);border-color:var(--yellow);color:#000;font-weight:800}.admin-link{color:var(--muted);font-size:12px;cursor:pointer}.view{padding-top:30px}.eyebrow{color:var(--yellow);font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:800}.hero{display:grid;grid-template-columns:1.08fr .92fr;gap:30px;align-items:center}.hero h1{font-size:clamp(48px,8vw,100px);line-height:.88;letter-spacing:-.065em;margin:12px 0 18px;max-width:680px}.hero h1 span{color:var(--yellow)}.lead{color:#d1d1cb;max-width:560px;font-size:18px}.hero-art{min-height:300px;border:1px solid #504a18;border-radius:30px;position:relative;overflow:hidden;background:radial-gradient(circle at 70% 35%,#ffe600 0 5%,transparent 6%),radial-gradient(circle at 65% 36%,#615700 0 17%,transparent 18%),linear-gradient(130deg,#181818,#050505 62%);box-shadow:inset 0 0 80px #000}.hero-art:before{content:"";position:absolute;inset:16% 12%;border:2px solid #665d00;border-radius:50%;transform:rotate(-20deg)}.hero-art:after{content:"STEAL\A THE SHOW.";white-space:pre;position:absolute;bottom:24px;left:24px;color:#fff;font-weight:950;font-style:italic;font-size:30px;line-height:.9}.section{margin-top:36px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:14px}.section h2{font-size:25px;margin:4px 0}.muted{color:var(--muted)}.schedule,.card,.panel,.state-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}.schedule{display:flex;gap:30px;flex-wrap:wrap}.schedule b{display:block;color:var(--yellow);font-size:11px;text-transform:uppercase;letter-spacing:.12em}.schedule span{white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.category{overflow:hidden;padding:0}.category-art{height:165px;background:linear-gradient(135deg,#302a00,#ffd900 48%,#121212 49%,#202020);position:relative}.category-art:after{content:"◒";position:absolute;right:24px;bottom:8px;font-size:95px;color:#0008;transform:rotate(-25deg)}.category-body{padding:18px}.category h3{margin:0 0 5px;font-size:22px}.meta{display:flex;gap:12px;color:var(--muted);font-size:13px;flex-wrap:wrap}.category .primary{margin-top:16px;width:100%;border-radius:12px;padding:12px}.detail-head{display:flex;align-items:center;gap:12px;margin-bottom:22px}.video{aspect-ratio:16/9;border-radius:18px;background:linear-gradient(135deg,#392f00,#111 48%,#5c5000);display:grid;place-items:center;font-size:45px;border:1px solid #6b5f00}.video span{display:grid;place-items:center;width:72px;height:72px;border-radius:50%;background:#000b;color:var(--yellow);border:2px solid var(--yellow)}.video-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.video-card{background:#0e0e0e;border:1px solid var(--line);border-radius:17px;padding:10px}.video-card .video{font-size:25px}.video-card .video span{width:44px;height:44px}.form-wrap{max-width:560px}.form-wrap h1{font-size:46px;line-height:1;margin:10px 0}.form-wrap p{color:var(--muted)}label{display:block;font-weight:700;margin:17px 0 7px}input{width:100%;background:#0e0e0e;color:#fff;border:1px solid #555;border-radius:12px;padding:13px 14px;outline:none}.form-actions{display:flex;gap:10px;align-items:center;margin-top:20px}.primary{border:0;border-radius:12px;padding:13px 20px}.quiet{color:var(--yellow);cursor:pointer;font-size:13px}.form-note{margin-top:22px;padding:15px;border-left:3px solid var(--yellow);color:#deded8;background:#171500}.admin-shell{display:grid;grid-template-columns:210px 1fr;gap:18px}.side{align-self:start;display:grid;gap:7px}.side button{text-align:left;background:transparent;color:var(--muted);border:1px solid transparent;border-radius:12px;padding:11px 13px}.side button.active,.side button:hover{background:var(--yellow);color:#000;font-weight:800}.submission{display:grid;grid-template-columns:1fr 1fr;gap:15px;align-items:start}.badge{display:inline-block;border:1px solid #665e00;color:var(--yellow);border-radius:99px;padding:4px 8px;font-size:11px}.states{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.state-card button{margin-top:12px}.footer{margin-top:38px;color:#777;font-size:12px;border-top:1px solid var(--line);padding-top:16px}
@media(max-width:760px){.shell{padding:12px 14px 45px}.topbar{align-items:flex-start;flex-wrap:wrap}.brand{margin-right:0}.nav{order:3;width:100%}.nav button{flex:1}.hero{grid-template-columns:1fr}.hero-art{min-height:220px}.hero h1{font-size:58px}.grid,.submission,.admin-shell{grid-template-columns:1fr}.schedule{display:grid;gap:13px}.schedule span{white-space:normal}.video-grid,.states{grid-template-columns:1fr}.side{display:flex;overflow:auto}.side button{white-space:nowrap}.form-wrap h1{font-size:38px}}
</style>
</head>
<body><div class="shell"><div class="notice">Prototipo isolato · dati mock · nessuna write</div>
<header class="topbar"><div class="brand"><div class="mark">H</div><div><strong>HAPPINESS SPASH CONTEST</strong><small>contest platform</small></div></div><nav class="nav"><button data-screen="contest" class="active">CONTEST</button><button data-screen="candidatura">CANDIDATURA</button></nav><span class="admin-link" data-screen="auth">Accesso Admin</span></header>
<main id="app" class="view"></main><footer class="footer">Mockup di esplorazione visiva basato sulle schermate reali dell'app. Nessuna autenticazione, upload o azione persistente.</footer></div>
<script>
const app=document.querySelector('#app'); const nav=[...document.querySelectorAll('[data-screen]')];
const categoryCard=(name,meta='1 video pubblicato')=>`<article class="card category"><div class="category-art"></div><div class="category-body"><h3>${name}</h3><div class="meta"><span>▱ ${meta}</span><span>29 posti disponibili</span></div><button class="primary" data-screen="category">Guarda i video →</button></div></article>`;
function render(screen='contest'){nav.forEach(b=>b.classList.toggle('active',b.dataset.screen===screen)); let html='';
if(screen==='contest')html=`<section class="hero"><div><div class="eyebrow">HAPPINESS SPASH CONTEST · CONTEST TEST 2</div><h1>STEAL THE <span>SHOW.</span></h1><p class="lead">Cattura un momento memorabile, carica e condividi il tuo video e partecipa alla competizione. Ogni categoria lascia spazio a tecnica, creatività e stile.</p><div class="form-actions"><button class="primary" data-screen="candidatura">Candidati ora</button><button class="ghost" data-screen="category">Esplora categorie</button></div></div><div class="hero-art" aria-label="Decorazione grafica padel"></div></section><section class="section"><div class="section-head"><div><div class="eyebrow">Contest</div><h2>Contest TEST 2</h2></div><span class="badge">Candidature chiuse</span></div><div class="schedule"><div><b>Candidature</b><span>29 set 2026, 13:00 → 30 set 2026, 12:00</span></div><div><b>Votazioni</b><span>30 set 2026, 13:00 → 5 ott 2026, 12:00</span></div></div></section><section class="section"><div class="section-head"><div><div class="eyebrow">Categorie</div><h2>Scopri i video</h2></div><button class="ghost" data-screen="category">Tutte le categorie</button></div><div class="grid">${categoryCard('SMASH PIU BELLO')}${categoryCard('SMASH PIU BELLO con foto','0 video pubblicati')}</div></section>`;
else if(screen==='candidatura')html=`<section class="form-wrap"><div class="eyebrow">Candidatura · Contest TEST 2</div><h1>Candidature chiuse.</h1><p>Il periodo è terminato il 30 set 2026, 12:00.</p><div class="form-note">La verifica email e il caricamento del video saranno disponibili quando si aprirà una nuova finestra candidature.</div><div class="form-actions"><button class="primary" data-screen="contest">Torna al Contest</button><button class="ghost" data-screen="open">Anteprima finestra aperta</button></div></section>`;
else if(screen==='open')html=`<section class="form-wrap"><div class="eyebrow">Candidatura · finestra aperta</div><h1>Verifica prima la tua email.</h1><p>Inserisci la tua email per ricevere un codice e iniziare la candidatura.</p><label>Email</label><input type="email" placeholder="nome@esempio.it"><div class="form-actions"><button class="primary" data-screen="verified">Invia codice</button><button class="ghost" data-screen="contest">Annulla</button></div></section>`;
else if(screen==='verified')html=`<section class="form-wrap"><div class="eyebrow">Candidatura · identità verificata</div><h1>La tua candidatura</h1><p>Completa i dati della candidatura e carica il video.</p><label>Nome candidato/protagonista</label><input placeholder="Nome mostrato pubblicamente"><label>Categoria</label><input value="SMASH PIU BELLO" readonly><label>Video</label><div class="panel">Seleziona il video da caricare · massimo secondo le regole del Contest</div><div class="form-actions"><button class="primary">Invia candidatura</button></div></section>`;
else if(screen==='category')html=`<div class="detail-head"><button class="back" data-screen="contest">← Tutte le categorie</button><div><div class="eyebrow">Contest TEST 2</div><h1 style="margin:0;font-size:38px">SMASH PIU BELLO</h1></div></div><p class="lead">Il punto più spettacolare: tecnica, potenza, creatività e stile.</p><div class="video-grid"><article class="video-card"><div class="video"><span>▶</span></div><h3>Matteo Volturo</h3><div class="meta">29 set 2026 · video pubblicato</div><button class="primary" disabled>Votazioni dal 30 set 2026</button></article><article class="video-card"><div class="video"><span>▶</span></div><h3>Luca Bianchi</h3><div class="meta">Video pubblicato</div><button class="primary" disabled>Votazioni dal 30 set 2026</button></article></div>`;
else if(screen==='auth')html=`<section class="form-wrap"><div class="eyebrow">HAPPINESS SPASH CONTEST</div><h1>Accesso Admin</h1><p>Accedi per configurare e gestire i contest.</p><label>Email</label><input type="email" placeholder="Inserisci la tua email"><label>Password</label><input type="password" placeholder="Inserisci la tua password"><div class="form-actions"><button class="primary">Accedi</button><span class="quiet" data-screen="recovery">Password dimenticata?</span></div><p class="quiet" data-screen="contest">← Torna al contest</p></section>`;
else if(screen==='recovery')html=`<section class="form-wrap"><div class="eyebrow">Accesso Admin</div><h1>Password dimenticata?</h1><p>Inserisci la tua email per ricevere il link di recupero.</p><label>Email</label><input type="email"><div class="form-actions"><button class="primary">Invia link</button><button class="ghost" data-screen="auth">Indietro</button></div></section>`;
else if(screen==='admin')html=`<section><div class="eyebrow">Amministra · Contest TEST 2</div><h1 style="font-size:42px;margin:8px 0 20px">Workspace Admin</h1><div class="admin-shell"><aside class="side"><button class="active">Candidature</button><button>Contest</button><button>Risultati</button><button>Impostazioni</button></aside><div><div class="section-head"><h2>Candidature</h2><span class="badge">2 da verificare</span></div><article class="panel submission"><div><div class="eyebrow">Nome candidato/protagonista</div><h2>Matteo Volturo</h2><p class="muted">Inserita dal partecipante · SMASH PIU BELLO</p><span class="badge">APPROVED</span></div><div><div class="video"><span>▶</span></div><div class="form-actions"><button class="primary">Approva</button><button class="ghost">Rifiuta</button></div></div></article></div></div></section>`;
else if(screen==='states')html=`<section><div class="eyebrow">Stati reali dell'app</div><h1 style="font-size:42px;margin:8px 0 20px">Loading, empty, error</h1><div class="states"><div class="state-card"><h2>Caricamento</h2><p class="muted">Caricamento in corso…</p></div><div class="state-card"><h2>Nessun video</h2><p class="muted">Nessun video pubblicato per questa categoria.</p></div><div class="state-card"><h2>Errore</h2><p class="muted">Impossibile caricare questa schermata. Riprova.</p></div></div></section>`;
app.innerHTML=html; app.querySelectorAll('[data-screen]').forEach(b=>b.addEventListener('click',()=>render(b.dataset.screen))); }
nav.forEach(b=>b.addEventListener('click',()=>render(b.dataset.screen))); render();
</script></body></html>
